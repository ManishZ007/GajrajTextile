# Run from the payment directory; OS environment variables override .env values.
spring.config.import=optional:file:./.env[.properties]
spring.application.name=payment
server.port=8088


# ============================================
# Database
# ============================================
spring.datasource.url=${PAYMENT_DB_URL}
spring.datasource.username=${PAYMENT_DB_USERNAME}
spring.datasource.password=${PAYMENT_DB_PASSWORD}



# ============================================
# Hibernate / JPA
# ============================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ============================================
# Security Config
# ============================================
server.servlet.session.cookie.same-site=STRICT
spring.main.web-application-type=SERVLET
spring.security.user.name=""
spring.security.user.password=""


# ============================================
# Razorpay
# ============================================
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
service.internal-token=${SERVICE_INTERNAL_TOKEN}
