    build: ./notification
    env_file:
      - path: ./notification/.env
        required: false
    environment:
      PORT: "4000"
      RABBITMQ_URL: amqp://gajraj:${RABBITMQ_PASSWORD}@rabbitmq:5672
      SITE_URL: http://localhost:3000
    depends_on:
      rabbitmq: {condition: service_healthy}
  customer-frontend:
