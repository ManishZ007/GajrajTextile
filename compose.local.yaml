      context: ./front-end/customer-frontend
      target: development
    ports: ["127.0.0.1:3000:3000"]
    env_file:
      - path: ./front-end/customer-frontend/.env.local
        required: false
    environment:
      AUTH_TRUST_HOST: "true"
      AUTH_SECRET: "${AUTH_SECRET}"
      AUTH_URL: http://localhost:3000
      AUTH_SERVICE_URL: http://authentication:8081
      DOCKER_INTERNAL_NETWORK: "true"
    depends_on:
      authentication: {condition: service_healthy}
  manager-frontend:
