      server_registry: {condition: service_healthy}
  server_registry:
    build: ./server_registry
    networks:
      default:
        aliases: [registry]
    ports: ["127.0.0.1:8761:8761"]
    env_file:
      - path: ./server_registry/.env
        required: false
    environment:
      SERVER_PORT: "8761"
      SPRING_PROFILES_ACTIVE: "docker"
      SPRING_JPA_SHOW_SQL: "false"
      EUREKA_INSTANCE_HOSTNAME: "registry"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8761'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
