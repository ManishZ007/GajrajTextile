name: gajraj-local
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: gajraj
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env.docker}
    ports: ["127.0.0.1:15673:15672"]
    volumes: ["rabbitmq_data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
  authentication:
    build: ./authentication
    ports: ["127.0.0.1:8081:8081"]
    env_file:
      - path: ./authentication/.env
        required: false
    environment:
      SERVER_PORT: "8081"
      SPRING_PROFILES_ACTIVE: "docker"
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/gajraj_paithani_auth"
      SPRING_DATASOURCE_USERNAME: "postgres"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD}"
      SPRING_APPLICATION_JSON: '{"eureka":{"client":{"serviceUrl":{"defaultZone":"http://registry:8761/eureka/"}}}}'
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      SPRING_RABBITMQ_HOST: "rabbitmq"
      SPRING_RABBITMQ_USERNAME: "gajraj"
      SPRING_RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD}"
      REDIS_HOST: "redis"
      REDIS_PASSWORD: ""
      CUSTOMER_FRONTEND_URL: "http://localhost:3000"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8081'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    depends_on:
      postgres: {condition: service_healthy}
      server_registry: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
  customer:
    build: ./customer
    ports: ["127.0.0.1:8082:8082"]
    env_file:
      - path: ./customer/.env
        required: false
    environment:
      SERVER_PORT: "8082"
      SPRING_PROFILES_ACTIVE: "docker"
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/gajraj_paithani_customers"
      SPRING_DATASOURCE_USERNAME: "postgres"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD}"
      SPRING_APPLICATION_JSON: '{"eureka":{"client":{"serviceUrl":{"defaultZone":"http://registry:8761/eureka/"}}}}'
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      SPRING_RABBITMQ_HOST: "rabbitmq"
      SPRING_RABBITMQ_USERNAME: "gajraj"
      SPRING_RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD}"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8082'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
