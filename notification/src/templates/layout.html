<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="x-apple-disable-message-reformatting">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <title>{{title}}</title>
  <style>
    body { margin:0; padding:0; width:100% !important; background:#F5F5F5; -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%; }
    table { border-collapse:collapse; mso-table-lspace:0; mso-table-rspace:0; }
    img { border:0; outline:none; text-decoration:none; -ms-interpolation-mode:bicubic; }
    @media only screen and (max-width:620px) {
      .outer { padding:0 !important; }
      .container { width:100% !important; }
      .px { padding-left:24px !important; padding-right:24px !important; }
      .h1 { font-size:26px !important; }
      .btn { width:100% !important; }
      .btn a { display:block !important; }
      .wordmark { width:180px !important; height:auto !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background:#F5F5F5;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;mso-hide:all;">{{preheader}}</div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#F5F5F5" style="background:#F5F5F5;">
    <tr>
      <td align="center" class="outer" style="padding:32px 16px;">
        <table role="presentation" class="container" width="600" cellpadding="0" cellspacing="0" border="0" bgcolor="#FFFFFF" style="width:600px;max-width:600px;background:#FFFFFF;">

          <tr>
            <td align="center" class="px" style="padding:44px 40px 32px 40px;">
              <img src="cid:logo-mark" width="48" height="48" alt="" style="display:block;border:0;margin:0 auto 16px auto;">
              <img src="cid:logo-wordmark" class="wordmark" width="224" height="16" alt="GAJRAJ PAITHANI" style="display:block;border:0;margin:0 auto;max-width:100%;height:auto;font-family:Georgia,'Times New Roman',serif;font-size:13px;letter-spacing:5px;color:#1B1B1B;">
            </td>
          </tr>
          <tr>
            <td class="px" style="padding:0 40px;">
              <div style="height:1px;line-height:1px;font-size:1px;background:#EBEBEB;">&nbsp;</div>
            </td>
          </tr>

          <tr>
            <td class="px" style="padding:48px 40px 44px 40px;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;">
{{content}}
            </td>
          </tr>

          <tr>
            <td align="center" class="px" bgcolor="#1B1B1B" style="background:#1B1B1B;padding:32px 40px;">
              <img src="cid:logo-mark-white" width="32" height="32" alt="" style="display:block;border:0;margin:0 auto 14px auto;">
              <p style="margin:0 0 12px 0;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#989898;">Yeola &middot; Nashik &middot; Maharashtra</p>
              <p style="margin:0;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:11px;line-height:1.7;font-weight:300;color:#6B6B6B;">&copy; {{year}} Gajraj Paithani. All rights reserved.</p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
